<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500">
  <filter id="p" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency="0.55 0.65" numOctaves="6" seed="3" stitchTiles="stitch" result="t"/>
    <feSpecularLighting in="t" surfaceScale="3" specularConstant="0.8" specularExponent="10" lighting-color="white" result="light">
      <fePointLight x="250" y="250" z="80"/>
    </feSpecularLighting>
    <feComposite in="light" in2="SourceGraphic" operator="in"/>
  </filter>
  <rect width="500" height="500" fill="#f0ece4" filter="url(#p)"/>
</svg>